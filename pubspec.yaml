name: ipardasbor
description: "Aplikasi I-PAR untuk kepentingan industri pariwisata"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  flutter_image_compress: ^2.5.0
  intl: ^0.20.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-kemenpar.png
    - assets/database/wilayah_indonesia.db
  